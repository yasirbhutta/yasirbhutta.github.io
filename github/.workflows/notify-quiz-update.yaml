name: Notify Quiz Update

on:
  push:
    branches:
      - main
    paths:
      - "_data/python/**"

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger quiz sync
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          repository: MuhammadBinYasir/YasirBhutta
          event-type: quiz-updated
